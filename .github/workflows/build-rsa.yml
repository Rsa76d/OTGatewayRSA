name: Build firmware (RSA)

on:
  push:
    branches: [ 'rsa/**', master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [ d1_mini, d1_mini32 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio/libdeps
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Use git tag for ESP32 platform (release zip returns 5xx)
        run: |
          sed -i 's#https://github.com/pioarduino/platform-espressif32/releases/download/\([0-9.]*\)/platform-espressif32.zip#https://github.com/pioarduino/platform-espressif32.git\#\1#' platformio.ini
          grep -n 'pioarduino/platform-espressif32' platformio.ini

      - name: Build ${{ matrix.env }}
        run: |
          # retry: platform/toolchain downloads from GitHub releases sometimes fail with 5xx
          for i in 1 2 3; do
            pio run -e ${{ matrix.env }} && exit 0
            echo "Build attempt $i failed, retrying in 20 s..."; sleep 20
          done
          exit 1

      - name: Collect firmware
        run: |
          VER=$(grep -m1 '^version' platformio.ini | sed 's/.*= *//')
          mkdir -p out
          cp .pio/build/${{ matrix.env }}/firmware.bin "out/firmware_${{ matrix.env }}_${VER}.bin"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware_${{ matrix.env }}
          path: out/*.bin

  publish:
    # copy built .bin files into the 'firmware-builds' branch (plain git access, no login needed to fetch)
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Commit firmware to firmware-builds branch
        run: |
          ls -l art || exit 0
          [ -n "$(ls art/*.bin 2>/dev/null)" ] || { echo "nothing to publish"; exit 0; }
          git init -q pub && cd pub
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin firmware-builds; then git checkout -q -b firmware-builds FETCH_HEAD; else git checkout -q --orphan firmware-builds; fi
          DIR="${GITHUB_REF_NAME//\//_}"
          mkdir -p "$DIR" && cp ../art/*.bin "$DIR/"
          git add -A
          git commit -q -m "firmware: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" || { echo "no changes"; exit 0; }
          git push -q origin firmware-builds
